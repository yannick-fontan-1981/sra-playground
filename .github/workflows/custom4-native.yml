name: Custom 4 browser validation
on:
  push:
    branches: [feat/custom4-ss01-integration-20261117]
    paths:
      - src/games/sinking-star/**
      - src/games/sinking-star.ts
      - src/runtime/**
      - src/main.ts
      - scripts/verify-ss01-browser.mjs
      - .github/workflows/custom4-native.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm ci
      - run: node --test tests/custom4-native.test.ts
      - run: npm run build
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/ss01-qa" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/ss01-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Play the real production application
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ss01-qa/node_modules/playwright/index.mjs
        run: node scripts/verify-ss01-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss01-custom4-browser-evidence
          path: validation/ss01-custom4/
          retention-days: 14
