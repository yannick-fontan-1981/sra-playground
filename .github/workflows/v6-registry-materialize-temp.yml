name: Temporary V6 registry synchronization

on:
  push:
    branches:
      - recovery/v6-registry-session-resume-sync-20261113
    paths:
      - '.github/workflows/v6-registry-materialize-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synchronize registry with qualified browser resume
        run: python3 scripts/sync-v6-registry-session-resume-temp.py
      - name: Validate registry and targeted resume guards
        run: |
          node scripts/check-v6-entry-point-progress.mjs
          node --experimental-transform-types --test \
            tests/v6-entry-point-progress.test.ts \
            tests/v6-browser-session-resume.test.ts
      - name: Commit synchronized registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/migration/v6-entry-point-progress.json \
            docs/recovery/v6-entry-point-registry-reconstruction-20261113.md \
            scripts/check-v6-entry-point-progress.mjs \
            tests/v6-entry-point-progress.test.ts
          git diff --cached --check
          git commit -m "docs(registry): activate browser checkpoint evidence"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: v6-registry-synchronized
          path: |
            docs/migration/v6-entry-point-progress.json
            docs/recovery/v6-entry-point-registry-reconstruction-20261113.md
            scripts/check-v6-entry-point-progress.mjs
            tests/v6-entry-point-progress.test.ts
          if-no-files-found: error
          retention-days: 1
