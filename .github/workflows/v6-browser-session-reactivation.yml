name: V6 browser session reactivation

on:
  push:
    branches:
      - recovery/v6-browser-session-reactivation-20261113
    paths:
      - 'src/runtime/v6-browser-common-campaign-host.ts'
      - 'src/runtime/v6-browser-product-campaign-host.ts'
      - 'src/runtime/v6-browser-agent-controller.ts'
      - 'tests/v6-browser-session-reactivation.test.ts'
      - '.github/workflows/v6-browser-session-reactivation.yml'
  pull_request:
    paths:
      - 'src/runtime/v6-browser-common-campaign-host.ts'
      - 'src/runtime/v6-browser-product-campaign-host.ts'
      - 'src/runtime/v6-browser-agent-controller.ts'
      - 'tests/v6-browser-session-reactivation.test.ts'
      - 'docs/recovery/v6-browser-session-reactivation-20261113.md'
      - 'docs/recovery/v6-browser-session-reactivation-qualified.json'
      - '.github/workflows/v6-browser-session-reactivation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Targeted browser continuity contracts
        run: >-
          node --experimental-transform-types --test
          tests/v6-browser-session-reactivation.test.ts
          tests/v6-browser-common-campaign-host.test.ts
          tests/v6-browser-agent-controller.test.ts
          tests/v6-common-campaign-session-continuity.test.ts
      - name: Complete TypeScript regression suite
        run: node --experimental-transform-types --test tests/*.test.ts
      - name: Capture production build diagnostics
        run: |
          set +e
          npm run build > browser-session-reactivation-build.log 2>&1
          status=$?
          cat browser-session-reactivation-build.log
          echo "$status" > browser-session-reactivation-build.status
          exit 0
      - name: Upload production build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-browser-session-reactivation-build-diagnostics
          path: |
            browser-session-reactivation-build.log
            browser-session-reactivation-build.status
          if-no-files-found: error
      - name: Enforce production build result
        run: test "$(cat browser-session-reactivation-build.status)" -eq 0
