name: Lot 9C1 bounded joint channels

on:
  push:
    branches:
      - recovery/lot9c1-bounded-joint-channels-20261113
  pull_request:
    branches:
      - recovery/site109-reconstruction-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Verify bounded joint-channel causality
        run: node --experimental-transform-types --test tests/v6-joint-channel-owner.test.ts
      - name: Run complete TypeScript regression suite
        run: node --experimental-transform-types --test tests/*.test.ts
