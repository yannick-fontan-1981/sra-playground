name: OP01-OP31 apply live capture fix

on:
  push:
    branches:
      - op01-op31-browser-durable-resume-20261113
    paths:
      - scripts/fix-op01-op31-browser-agent-live-capture.mjs
      - .github/workflows/op01-op31-browser-live-capture-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: op01-op31-browser-durable-resume-20261113
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply idempotence fix
        run: node scripts/fix-op01-op31-browser-agent-live-capture.mjs
      - name: Validate controller and capture proof
        run: |
          npm run typecheck
          node --experimental-transform-types --test tests/v6-browser-agent-live-capture.test.ts tests/v6-browser-session-resume.test.ts
      - name: Remove temporary fix machinery
        run: |
          rm scripts/fix-op01-op31-browser-agent-live-capture.mjs
          rm .github/workflows/op01-op31-browser-live-capture-fix.yml
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/v6-browser-agent-controller.ts scripts/fix-op01-op31-browser-agent-live-capture.mjs .github/workflows/op01-op31-browser-live-capture-fix.yml
          git commit -m "fix(op01-op31): keep live Agent checkpoint capture idempotent"
          git push origin HEAD:op01-op31-browser-durable-resume-20261113
