name: Lot 9C joint_channels recovery audit

on:
  push:
    branches:
      - recovery/lot9c-joint-channels-audit-20261112
    paths-ignore:
      - docs/recovery/lot9c-joint-channels-audit.md
      - docs/recovery/lot9c-joint-channels-audit.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every remote branch
        run: git fetch --all --prune
      - name: Generate evidence audit
        run: python3 scripts/audit-lot9c-joint-channels.py
      - name: Commit durable audit
        run: |
          if git diff --quiet -- docs/recovery/lot9c-joint-channels-audit.md docs/recovery/lot9c-joint-channels-audit.json; then
            echo "Audit already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recovery/lot9c-joint-channels-audit.md docs/recovery/lot9c-joint-channels-audit.json
          git commit -m "docs(lot9c): persist joint_channels recovery audit [skip ci]"
          git push origin HEAD:recovery/lot9c-joint-channels-audit-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot9c-joint-channels-audit
          path: |
            docs/recovery/lot9c-joint-channels-audit.md
            docs/recovery/lot9c-joint-channels-audit.json
          if-no-files-found: error
