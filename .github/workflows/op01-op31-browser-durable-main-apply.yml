name: OP01-OP31 apply durable browser main

on:
  push:
    branches:
      - op01-op31-browser-durable-resume-20261113
    paths:
      - scripts/apply-op01-op31-browser-durable-main.mjs
      - .github/workflows/op01-op31-browser-durable-main-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: op01-op31-browser-durable-resume-20261113
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply product integration
        run: node scripts/apply-op01-op31-browser-durable-main.mjs
      - name: Typecheck integrated product
        run: npm run typecheck
      - name: Main and durable resume tests
        run: >-
          node --experimental-transform-types --test
          tests/main-browser-agent-controller-integration.test.ts
          tests/browser-game-runtime-checkpoint.test.ts
          tests/v6-browser-durable-session.test.ts
          tests/v6-browser-session-resume.test.ts
      - name: Commit product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(op01-op31): persist and restore browser Agent sessions"
          git push origin HEAD:op01-op31-browser-durable-resume-20261113
