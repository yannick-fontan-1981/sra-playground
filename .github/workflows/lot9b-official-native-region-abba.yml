name: Lot 9B official native Region ABBA

on:
  push:
    branches:
      - recovery/lot9b-official-measurement-20261112
  workflow_dispatch:

concurrency:
  group: lot9b-official-native-region-abba
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOT9B_MEASUREMENT_ISOLATION: non-isolated-shared-github-actions-runner-no-repository-concurrency
      LOT9B_OFFICIAL_BENCHMARK_REPORT: lot9b-official-native-region-abba-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
      - name: Prepare pinned Pyodide assets
        run: node scripts/prepare-python.mjs
      - name: Verify manifest and source refs
        run: node scripts/verify-native-loop-runner-manifest.mjs
      - name: Typecheck browser benchmark
        run: npm run typecheck
      - name: Targeted benchmark contract tests
        run: |
          node --test \
            tests/native-loop-cost-harness.test.mjs \
            tests/native-loop-session-adapter.test.mjs \
            tests/native-loop-browser-worker-dispatch.test.mjs \
            tests/native-loop-region-source-refs.test.mjs
      - name: Show browser runtime
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser
          (google-chrome-stable --version || google-chrome --version || chromium --version || chromium-browser --version)
      - name: Execute official A1 B1 B2 A2 protocol
        run: node scripts/run-native-region-official-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot9b-official-native-region-abba
          path: lot9b-official-native-region-abba-report.json
          if-no-files-found: warn
