name: V6 current entry registry

on:
  push:
    branches:
      - 'recovery/v6-current-entry-registry-*'
    paths:
      - '.github/workflows/v6-current-entry-registry.yml'
      - 'docs/migration/v6-current-entry-registry.json'
      - 'docs/migration/v6-current-entry-registry/*.json'
      - 'docs/migration/v6-current-entry-registry.md'
      - 'docs/migration/v6-delivery-roadmap.md'
      - 'scripts/verify-v6-current-entry-registry.mjs'
      - 'scripts/sync-v6-delivery-roadmap-registry.mjs'
      - 'tests/v6-current-entry-registry.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/v6-current-entry-registry.yml'
      - 'docs/migration/v6-current-entry-registry.json'
      - 'docs/migration/v6-current-entry-registry/*.json'
      - 'docs/migration/v6-current-entry-registry.md'
      - 'docs/migration/v6-delivery-roadmap.md'
      - 'scripts/verify-v6-current-entry-registry.mjs'
      - 'scripts/sync-v6-delivery-roadmap-registry.mjs'
      - 'tests/v6-current-entry-registry.test.mjs'

concurrency:
  group: v6-current-entry-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify registry and generated Markdown
        run: node scripts/verify-v6-current-entry-registry.mjs

      - name: Verify delivery roadmap registry status
        run: node scripts/sync-v6-delivery-roadmap-registry.mjs --check

      - name: Run registry contract tests
        run: node --test tests/v6-current-entry-registry.test.mjs

      - name: Run complete TypeScript regression suite
        run: node --experimental-transform-types --test tests/*.test.ts

      - name: Build production bundle
        run: npm run build
