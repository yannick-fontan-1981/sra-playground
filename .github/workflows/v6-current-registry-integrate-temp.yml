name: Integrate current V6 reconstruction registry

on:
  push:
    branches:
      - recovery/v6-current-registry-integration-20261113

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Merge qualified registry work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin recovery/v6-current-reconstruction-registry-20261113
          git merge --no-ff --no-edit origin/recovery/v6-current-reconstruction-registry-20261113
      - name: Update persistent roadmaps
        run: node scripts/update-v6-current-registry-roadmaps-temp.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify current reconstruction registry
        run: node scripts/verify-v6-current-reconstruction-registry.mjs
      - name: Test registry guard
        run: node --test tests/v6-current-reconstruction-registry.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full TypeScript regression
        run: node --experimental-transform-types --test tests/*.test.ts
      - name: Production build
        run: npm run build
      - name: Commit and push integration
        run: |
          git add \
            docs/migration/v6-delivery-roadmap.md \
            docs/recovery/site109-reconstruction-status.md \
            docs/recovery/op01-op31-official-readiness-status.md \
            docs/migration/op01-op31-progress.md
          git commit -m "Integrate current V6 reconstruction registry"
          git push origin HEAD:${GITHUB_REF_NAME}
