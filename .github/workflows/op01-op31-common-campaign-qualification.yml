name: OP01-OP31 common campaign qualification

on:
  push:
    branches:
      - op01-op31-common-campaign-owner-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Full TypeScript regression
        run: node --experimental-transform-types --test tests/*.test.ts
      - name: Common campaign micro-diagnostic
        run: node --experimental-transform-types scripts/measure-op01-op31-common-campaign-costs.mjs
