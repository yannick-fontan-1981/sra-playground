name: Regenerate optimized Region source refs

on:
  push:
    branches:
      - recovery/op01-op31-browser-field-stock-context-20261112

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Recompute source refs
        run: node scripts/native-loop-region-source-refs.mjs --output docs/recovery/native-loop-source-refs.json
      - name: Update manifest identities
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const refsPath = 'docs/recovery/native-loop-source-refs.json';
          const manifestPath = 'docs/recovery/native-loop-runner-manifest.json';
          const refs = JSON.parse(await readFile(refsPath, 'utf8'));
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          manifest.sourceRefs.commonRoot = refs.commonRoot;
          manifest.sourceRefs.candidateRoot = refs.candidateRoot;
          manifest.sourceRefs.reference = refs.reference.sourceRef;
          manifest.sourceRefs.candidate = refs.candidate.sourceRef;
          for (const runner of manifest.runners) {
            runner.sourceRef = runner.variant === 'A'
              ? refs.reference.sourceRef
              : refs.candidate.sourceRef;
          }
          manifest.qualification.sourceRefRun = {
            runId: Number(process.env.GITHUB_RUN_ID),
            headSha: process.env.GITHUB_SHA,
            sourceRefsComputed: true,
            manifestVerification: 'passed-before-commit',
          };
          manifest.officialMeasurement = {
            executed: false,
            result: null,
            reason: 'borrowed-readonly Region hook identity verified; strict official ABBA measurement pending',
          };
          await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Verify regenerated identities
        run: node scripts/verify-native-loop-runner-manifest.mjs
      - name: Test source-ref and hook ownership contracts
        run: |
          node --test \
            tests/native-loop-region-source-refs.test.mjs \
            tests/native-loop-runner-manifest.test.mjs \
            tests/native-loop-region-candidate-hook.test.mjs \
            tests/native-loop-public-corpus-runner.test.mjs \
            tests/native-loop-explicit-runners.test.mjs \
            tests/native-loop-borrowed-hook-inputs.test.mjs
      - name: Commit regenerated identities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recovery/native-loop-source-refs.json docs/recovery/native-loop-runner-manifest.json
          git commit -m "Regenerate source refs for borrowed Region hook"
          git push origin HEAD:${GITHUB_REF_NAME}
