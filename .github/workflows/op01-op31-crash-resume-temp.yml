name: Temporary OP01-OP31 crash resume integration

on:
  push:
    branches:
      - recovery/op01-op31-crash-resume-20261113
    paths:
      - '.github/workflows/op01-op31-crash-resume-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply crash-resume slice
        run: |
          python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          payload = ''.join(
              Path(f'scripts/.op01-op31-crash-resume.part{index}').read_text(encoding='utf-8').strip()
              for index in range(7)
          )
          source = zlib.decompress(base64.b64decode(payload))
          patch_file = Path.cwd() / 'scripts' / 'apply-op01-op31-crash-resume-temp.py'
          exec(
              compile(source, str(patch_file), 'exec'),
              {'__file__': str(patch_file), '__name__': '__main__'},
          )

          qualifier_path = Path('scripts/qualify-op01-op31-browser-crash-resume.mjs')
          qualifier = qualifier_path.read_text(encoding='utf-8')

          old = "  const phaseReady = deferred();\n  const finalReport = deferred();\n"
          new = """  const phaseReady = deferred();
            const repeatedPhaseReady = deferred();
            const finalReport = deferred();
            let phaseReadyCount = 0;
            const phaseReadyTarget = {
              resolve(payload) {
                phaseReadyCount += 1;
                if (phaseReadyCount === 1) phaseReady.resolve(payload);
                else repeatedPhaseReady.resolve(payload);
              },
              reject(error) {
                phaseReady.reject(error);
                repeatedPhaseReady.reject(error);
              },
            };
          """
          assert qualifier.count(old) == 1
          qualifier = qualifier.replace(old, new)

          old = "        viteServer.middlewares.use(PHASE_READY_PATH, bodyEndpoint(phaseReady));\n"
          new = "        viteServer.middlewares.use(PHASE_READY_PATH, bodyEndpoint(phaseReadyTarget));\n"
          assert qualifier.count(old) == 1
          qualifier = qualifier.replace(old, new)

          old = "    assert(firstPayload?.dispatchCheckpointSaved === true, 'phase one did not persist at physical dispatch');\n\n    await killProcessGroup(firstChrome);\n"
          new = """    assert(firstPayload?.dispatchCheckpointSaved === true, 'phase one did not persist at physical dispatch');
              // localStorage is synchronous in the renderer, but Chrome's profile database flush is asynchronous.
              // Keep the tab alive briefly, without navigation or pagehide, before the deliberate process crash.
              await delay(3_000);

              await killProcessGroup(firstChrome);
          """
          assert qualifier.count(old) == 1
          qualifier = qualifier.replace(old, new)

          old = """    secondChrome = spawnChrome(profile, stderr);
              const payload = await Promise.race([
                finalReport.promise,
                delay(600_000).then(() => {
                  throw new Error(`phase-two crash reconstruction timed out\\n${stderr.join('').slice(-6000)}`);
                }),
              ]);
              if (!payload || payload.status !== 'success') {
          """
          new = """    secondChrome = spawnChrome(profile, stderr);
              const phaseTwoOutcome = await Promise.race([
                finalReport.promise.then(payload => ({ kind: 'report', payload })),
                repeatedPhaseReady.promise.then(payload => ({ kind: 'restarted-phase-one', payload })),
                delay(600_000).then(() => {
                  throw new Error(`phase-two crash reconstruction timed out\\n${stderr.join('').slice(-6000)}`);
                }),
              ]);
              if (phaseTwoOutcome.kind === 'restarted-phase-one') {
                throw new Error(
                  `second Chrome restarted phase one instead of restoring durable state: ${JSON.stringify(phaseTwoOutcome.payload)}`,
                );
              }
              const payload = phaseTwoOutcome.payload;
              if (!payload || payload.status !== 'success') {
          """
          assert qualifier.count(old) == 1
          qualifier = qualifier.replace(old, new)

          old = "    '--disable-background-networking',\n"
          new = "    '--disable-background-networking',\n    '--disable-session-crashed-bubble',\n"
          assert qualifier.count(old) == 1
          qualifier = qualifier.replace(old, new)
          qualifier_path.write_text(qualifier, encoding='utf-8')
          PY
      - name: Build production bundle
        run: npm run build
      - name: Verify targeted TypeScript boundaries
        run: >-
          node --experimental-transform-types --test
          tests/browser-game-runtime-checkpoint.test.ts
          tests/v6-browser-durable-session.test.ts
          tests/v6-browser-agent-live-capture.test.ts
          tests/main-browser-durable-session-integration.test.ts
      - name: Qualify hard Chrome process kill and Pyodide reconstruction
        env:
          OP01_OP31_BROWSER_CRASH_REPORT: docs/recovery/op01-op31-browser-crash-resume-qualified.json
        run: node scripts/qualify-op01-op31-browser-crash-resume.mjs
      - name: Bind report to this Actions run
        run: sed -i "s/RUN_ID_PLACEHOLDER/${GITHUB_RUN_ID}/g" docs/recovery/op01-op31-browser-crash-resume-20261113.md
      - name: Verify structured proof contract
        run: node --test tests/op01-op31-browser-crash-resume-contract.test.mjs
      - name: Validate reconstructed registry
        run: node scripts/check-v6-entry-point-progress.mjs
      - name: Run registry guards
        run: node --experimental-transform-types --test tests/v6-entry-point-progress.test.ts
      - name: Run complete TypeScript regression suite
        run: node --experimental-transform-types --test tests/*.test.ts
      - name: Preserve OP catalogue and call-site regressions
        run: >-
          node --experimental-transform-types --test
          tests/v6-operations.test.ts
          tests/op01-op31-call-sites.test.ts
      - name: Commit and push qualified slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/op01-op31-browser-crash-resume.yml \
            docs/migration/op01-op31-progress.md \
            docs/migration/v6-entry-point-progress.json \
            docs/recovery/op01-op31-browser-crash-resume-20261113.md \
            docs/recovery/op01-op31-browser-crash-resume-qualified.json \
            docs/recovery/v6-entry-point-registry-reconstruction-20261113.md \
            scripts/check-v6-entry-point-progress.mjs \
            scripts/qualify-op01-op31-browser-crash-resume.mjs \
            src/main.ts \
            tests/browser/op01-op31-browser-crash-resume.html \
            tests/browser/op01-op31-browser-crash-resume.ts \
            tests/main-browser-durable-session-integration.test.ts \
            tests/op01-op31-browser-crash-resume-contract.test.mjs \
            tests/v6-entry-point-progress.test.ts
          git diff --cached --check
          git commit -m "feat(runtime): persist Agent dispatch before hard crash"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op01-op31-browser-crash-resume-qualified
          path: docs/recovery/op01-op31-browser-crash-resume-qualified.json
          if-no-files-found: warn
