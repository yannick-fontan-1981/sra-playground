name: OP01-OP31 finalize durable resume on canonical

on:
  push:
    branches:
      - op01-op31-browser-durable-resume-20261113
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  qualify-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: op01-op31-browser-durable-resume-20261113
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted durable resume tests
        run: |
          set -o pipefail
          node --experimental-transform-types --test \
            tests/browser-game-runtime-checkpoint.test.ts \
            tests/v6-browser-durable-session.test.ts \
            tests/v6-browser-agent-live-capture.test.ts \
            tests/v6-browser-session-resume.test.ts \
            tests/browser-game-worker-transport.test.ts \
            tests/main-browser-durable-session-integration.test.ts \
            tests/main-browser-agent-controller-integration.test.ts \
            | tee /tmp/op01-op31-targeted-tests.log
          grep -q '^# tests 34$' /tmp/op01-op31-targeted-tests.log
          grep -q '^# pass 34$' /tmp/op01-op31-targeted-tests.log
          grep -q '^# fail 0$' /tmp/op01-op31-targeted-tests.log

      - name: Canonical live-session contract tests
        run: |
          set -o pipefail
          node --test tests/op01-op31-live-smlp-session-resume-contract.test.mjs \
            | tee /tmp/op01-op31-canonical-contract-tests.log
          grep -q '^# tests 5$' /tmp/op01-op31-canonical-contract-tests.log
          grep -q '^# pass 5$' /tmp/op01-op31-canonical-contract-tests.log
          grep -q '^# fail 0$' /tmp/op01-op31-canonical-contract-tests.log

      - name: Production build
        run: |
          set -o pipefail
          npm run build | tee /tmp/op01-op31-build.log
          grep -q '67 modules transformed' /tmp/op01-op31-build.log
          grep -q '100 games' /tmp/op01-op31-build.log
          grep -q '636 level previews' /tmp/op01-op31-build.log
          grep -q 'four native image atlas' /tmp/op01-op31-build.log

      - name: Canonical real Chrome Worker and Pyodide session continuity
        env:
          OP01_OP31_LIVE_SMLP_SESSION_RESUME_REPORT: /tmp/op01-op31-canonical-live-session-resume.json
        run: node scripts/qualify-op01-op31-live-smlp-session-resume.mjs

      - name: Durable Chrome and Pyodide reload qualification
        env:
          OP01_OP31_BROWSER_DURABLE_REPORT: /tmp/op01-op31-browser-durable-resume.json
        run: node scripts/qualify-op01-op31-browser-durable-resume.mjs

      - name: Resolve qualification job identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job_id="$({
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          } | jq -r '.jobs[] | select(.name == "qualify-and-finalize") | .id' | head -n 1)"
          test -n "${job_id}"
          test "${job_id}" != "null"
          echo "OP01_OP31_JOB_ID=${job_id}" >> "${GITHUB_ENV}"

      - name: Write final canonical durable evidence
        env:
          OP01_OP31_DURABLE_REPORT: /tmp/op01-op31-browser-durable-resume.json
          OP01_OP31_CANONICAL_LIVE_REPORT: /tmp/op01-op31-canonical-live-session-resume.json
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize-op01-op31-browser-durable-canonical-reconcile.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'return source.slice(0, startIndex) + replacement + source.slice(endIndex);'
          new = 'return source.slice(0, startIndex) + replacement + source.slice(endIndex + end.length);'
          if text.count(old) != 1:
              raise SystemExit('finalizer replacement anchor changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node scripts/finalize-op01-op31-browser-durable-canonical-reconcile.mjs

      - name: Verify reconstructed V6 evidence registry
        run: node scripts/check-v6-entry-point-progress.mjs

      - name: Full TypeScript regression
        run: |
          set -o pipefail
          node --experimental-transform-types --test tests/*.test.ts \
            | tee /tmp/op01-op31-full-tests.log
          grep -q '^# tests 413$' /tmp/op01-op31-full-tests.log
          grep -q '^# pass 413$' /tmp/op01-op31-full-tests.log
          grep -q '^# fail 0$' /tmp/op01-op31-full-tests.log

      - name: Remove temporary reconciliation machinery
        run: |
          rm -f .github/workflows/op01-op31-browser-durable-canonical-finalize.yml
          rm -f scripts/finalize-op01-op31-browser-durable-canonical-reconcile.mjs

      - name: Commit final canonical durable evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs(op01-op31): reconcile final canonical durable evidence [browser-durable-canonical-finalized]"
          git push origin HEAD:op01-op31-browser-durable-resume-20261113
