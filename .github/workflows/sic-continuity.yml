name: SIC continuity
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sic-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: TypeScript and continuity contracts
    runs-on: ubuntu-24.04
    # The previous complete setup/typecheck/unit-test phase took under four minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/sic-continuity-contract.test.mjs tests/sic-continuity-evidence.test.mjs tests/sic-verified-walking-series.test.ts tests/sic-spatial-series.test.ts tests/v6-branch-routing-kernel.test.ts
      - run: node --test tests/sic-cursor-role-memory.test.ts tests/sic-observed-actor-composition.test.ts tests/sic-contact-transfer.test.ts tests/sic-contact-frontier.test.ts
      - run: node --test tests/sic-observed-push-access.test.ts tests/sic-observed-coverage.test.ts tests/sic-observed-exchange.test.ts tests/sic-observed-field-carry.test.ts
      - run: node --test tests/v6-agent.test.ts tests/v6-native-runtime.test.ts
      - run: node --test tests/sic-oriented-delivery-continuity.test.ts tests/v6-knowledge-store-noop.test.ts tests/sic-prepared-effects-native-state.test.ts
      - run: node --test tests/sic-preview-interface.test.ts tests/sic-experiment-arbitration.test.ts tests/sic-population-control-transfer.test.ts tests/sic-transferred-population-selection.test.ts
      - run: node --test tests/sic-compartment-encounter.test.ts tests/sic-directional-reception-transfer.test.ts
      - run: node --test tests/sic-ordered-feedback-transfer.test.ts tests/sic-feedback-partitions.test.ts
      - run: node --test tests/sic-channel-mixture-transfer.test.ts
      - run: node --test tests/sic-reception-control-transfer.test.ts tests/sic-reception-sequence.test.ts
      - run: node --test tests/sic-profile-transfer-continuity.test.ts tests/sic-profile-rank-order.test.ts tests/sic-profile-continuity-contract.test.mjs
      - run: node --test tests/sic-catalogue-view-transfer.test.ts tests/sic-panel-chain-transfer.test.ts
      - run: node --test tests/sic-queued-control-transfer.test.ts tests/sic-queue-continuity-evidence.test.mjs tests/sic-queue-continuity-contract.test.mjs
      - run: node --test tests/sic-observed-route-transfer.test.ts tests/sic-observed-route-continuity.test.ts tests/sic-outline-service.test.ts
      - run: node --test tests/sic-route-opening-evidence.test.mjs tests/sic-route-opening-contract.test.mjs tests/sic-population-continuity-evidence.test.ts
      - run: node --test tests/sic-population-continuity-contract.test.mjs tests/sic-passage-continuity-evidence.test.mjs tests/sic-passage-continuity-contract.test.mjs
      - run: node --test tests/sic-edge-switch-transfer.test.ts tests/sic-settle-matching-edges.test.ts tests/sic-public-panel-continuation.test.ts tests/sic-acquired-control-evidence.test.mjs tests/sic-acquired-control-contract.test.mjs
      - run: node --test tests/sic-guarded-passenger-continuity.test.ts tests/sic-passenger-continuity-evidence.test.mjs
      - run: node --test tests/sic-crossing-row-transfer.test.ts tests/sic-crossing-continuity.test.ts tests/sic-crossing-campaign-contract.test.mjs
      - run: node --test tests/sic-marked-control-state.test.ts tests/sic-marked-outlet-transfer.test.ts tests/sic-marked-compartment-flow.test.ts
      - run: node --test tests/sic-paired-passage-continuity.test.ts
      - run: node --test tests/sic-carrier-camera.test.ts tests/sic-carrier-reduction-transfer.test.ts tests/sic-carrier-preparation-continuity.test.ts tests/sic-carrier-preparation-contract.test.mjs
      - run: node --test tests/sic-support-selection-continuity.test.ts
      - run: node --test tests/sic-surface-exploration-transfer.test.ts tests/sic-surface-passage-transfer.test.ts tests/sic-surface-goal-route.test.ts tests/sic-surface-continuity-evidence.test.mjs
      - run: node --test tests/sic-glyph-cycle-continuity.test.ts tests/sic-moving-glyph-route.test.ts
      - run: node --test tests/sic-workshop-phase-continuity-evidence.test.mjs tests/sic-workshop-phase-continuity-contract.test.mjs tests/sic-workshop-phase-real-continuity.test.mjs tests/sic-continuity-workshop-gate.test.mjs

  cohort-replays:
    name: Continuity / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Historical cohorts took up to 2m13s; retain room for WA30 and runner variance.
    # This job timeout does not change the game's action or active-time budgets.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { name: oriented-delivery, cohort: 'source:WA30', end: 7, cap: 136 }
          - { name: mirror-isles, cohort: SS01, end: 8, cap: 120 }
          - { name: la-force-rouge, cohort: SS02, end: 8, cap: 160 }
          - { name: la-ruse-verte, cohort: SS03, end: 8, cap: 240 }
          - { name: l-axe-violet, cohort: SS04, end: 8, cap: 150 }
          - { name: local-carry, cohort: SS05, end: 8, cap: 155 }
          - { name: actor-composition, cohort: SS06, end: 8, cap: 125 }
          - { name: destination-set, cohort: SS07, end: 8, cap: 180 }
          - { name: marked-field, cohort: 'source:SIGN', end: 6, cap: 98 }
          - { name: cargo-transport, cohort: 'source:GABA', end: 6, cap: 128 }
          - { name: profile-preparation, cohort: 'source:LKEY', end: 6, cap: 36 }
          - { name: queue-receipts, cohort: 'source:COLM', end: 6, cap: 69 }
          - { name: observed-openings, cohort: 'source:ESCT', end: 6, cap: 30 }
          - { name: population-preparation, cohort: 'source:VOIS', end: 6, cap: 80 }
          - { name: passage-walking, cohort: 'source:PORT', end: 6, cap: 32 }
          - { name: workshop-phase, cohort: 'source:LS20', end: 7, cap: 129 }
          - { name: matching-edges, cohort: 'source:GRAV', end: 6, cap: 57 }
          - { name: public-panel, cohort: 'source:DC22', end: 6, cap: 271 }
          - { name: guarded-passengers, cohort: 'source:CGWL', end: 6, cap: 74 }
          - { name: crossing-rows, cohort: 'source:WEAV', end: 6, cap: 48 }
          - { name: carrier-preparation, cohort: 'source:LF52', end: 10, cap: 178 }
          - { name: native-sources, cohort: 'source:AR25,HANO', end: 1, cap: 120 }
    env:
      SIC_STUDY_CONTINUITY: '1'
      SIC_STUDY_WORKERS: '1'
      SIC_STUDY_SOLVER: sic
      COHORT_NAME: ${{ matrix.name }}
      COHORT: ${{ matrix.cohort }}
      LAST_LEVEL: ${{ matrix.end }}
      ACTION_CAP: ${{ matrix.cap }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-python.mjs
      - name: Replay one complete cohort from level one
        run: |
          mkdir -p continuity
          node scripts/compare-source100.mjs . . "continuity/$COHORT_NAME.jsonl" "$COHORT" 1 "$LAST_LEVEL" "$ACTION_CAP"
      - name: Validate cohort and bind evidence to the checkout
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { checkRun } from './scripts/verify-sic-continuity.mjs';
          const { COHORT_NAME: name, COHORT: cohort, GITHUB_SHA: sha } = process.env;
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sha);
          const file = `${name}.jsonl`, raw = readFileSync(`continuity/${file}`);
          const runs = raw.toString().trim().split(/\r?\n/).map(JSON.parse);
          const codes = cohort.replace(/^source:/, '').split(',').sort();
          assert.deepEqual(runs.map(run => run.code).sort(), codes);
          for (const run of runs) {
            assert.equal(run.start, 1); assert.equal(run.initialCompleted, 0);
            assert.equal(run.finish, Number(process.env.LAST_LEVEL));
            assert.equal(run.cap, Number(process.env.ACTION_CAP));
            assert.equal(run.parallelWorkers, 1); assert.equal(run.solver, 'sic');
            checkRun(run);
          }
          const manifest = { schema: 'sic.continuity-ci.v1', sha, runId: process.env.GITHUB_RUN_ID,
            name, cohort, codes, start: 1, end: Number(process.env.LAST_LEVEL), cap: Number(process.env.ACTION_CAP),
            solver: 'sic', parallelWorkers: 1, file, sha256: createHash('sha256').update(raw).digest('hex') };
          writeFileSync(`continuity/${name}.manifest.json`, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Retain executed evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sic-continuity-${{ github.sha }}-${{ matrix.name }}
          path: continuity/
          if-no-files-found: error
          # A failed-job rerun replaces only this cohort's artifact in this run.
          overwrite: true
          retention-days: 7

  executed-series:
    name: Executed series and final reconciliation
    needs: [contracts, cohort-replays]
    if: always()
    runs-on: ubuntu-24.04
    # Only artifact checks and deterministic physical verification run here.
    timeout-minutes: 5
    steps:
      - name: Require successful contracts and every replay
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          REPLAYS_RESULT: ${{ needs.cohort-replays.result }}
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$REPLAYS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: sic-continuity-${{ github.sha }}-*
          path: continuity
          merge-multiple: true
      - name: Verify the complete cohort set and matching source revision
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync } from 'node:fs';
          const expected = [
            ['oriented-delivery', 'source:WA30', 7, 136], ['mirror-isles', 'SS01', 8, 120],
            ['la-force-rouge', 'SS02', 8, 160], ['la-ruse-verte', 'SS03', 8, 240],
            ['l-axe-violet', 'SS04', 8, 150], ['local-carry', 'SS05', 8, 155],
            ['actor-composition', 'SS06', 8, 125], ['destination-set', 'SS07', 8, 180],
            ['marked-field', 'source:SIGN', 6, 98], ['cargo-transport', 'source:GABA', 6, 128],
            ['profile-preparation', 'source:LKEY', 6, 36],
            ['queue-receipts', 'source:COLM', 6, 69],
            ['observed-openings', 'source:ESCT', 6, 30],
            ['population-preparation', 'source:VOIS', 6, 80],
            ['passage-walking', 'source:PORT', 6, 32],
            ['workshop-phase', 'source:LS20', 7, 129],
            ['matching-edges', 'source:GRAV', 6, 57],
            ['public-panel', 'source:DC22', 6, 271],
            ['guarded-passengers', 'source:CGWL', 6, 74],
            ['crossing-rows', 'source:WEAV', 6, 48],
            ['carrier-preparation', 'source:LF52', 10, 178],
            ['native-sources', 'source:AR25,HANO', 1, 120],
          ];
          const { GITHUB_SHA: sha, GITHUB_RUN_ID: runId } = process.env;
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sha);
          const files = readdirSync('continuity');
          assert.deepEqual(files.sort(), expected.flatMap(([name]) => [`${name}.jsonl`, `${name}.manifest.json`]).sort());
          for (const [name, cohort, end, cap] of expected) {
            const file = `${name}.jsonl`, raw = readFileSync(`continuity/${file}`);
            const codes = cohort.replace(/^source:/, '').split(',').sort();
            assert.deepEqual(JSON.parse(readFileSync(`continuity/${name}.manifest.json`, 'utf8')),
              { schema: 'sic.continuity-ci.v1', sha, runId, name, cohort, codes, start: 1, end, cap,
                solver: 'sic', parallelWorkers: 1, file, sha256: createHash('sha256').update(raw).digest('hex') });
            const runs = raw.toString().trim().split(/\r?\n/).map(JSON.parse);
            assert.deepEqual(runs.map(run => run.code).sort(), codes);
            for (const run of runs) {
              assert.equal(run.start, 1); assert.equal(run.initialCompleted, 0);
              assert.equal(run.finish, end); assert.equal(run.cap, cap);
              assert.equal(run.parallelWorkers, 1); assert.equal(run.solver, 'sic');
            }
          }
          NODE
      - run: npm run test:sic-continuity -- continuity/*.jsonl
