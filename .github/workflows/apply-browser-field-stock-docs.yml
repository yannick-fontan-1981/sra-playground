name: Apply browser FieldStock documentation consolidation

on:
  push:
    branches:
      - recovery/op01-op31-browser-field-stock-context-20261112

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply-browser-field-stock-docs.py
      - name: Commit consolidated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/op01-op31-progress.md \
            docs/recovery/site109-reconstruction-status.md \
            docs/recovery/op01-op31-browser-campaign-host-20261112.md \
            docs/recovery/op01-op31-browser-agent-controller-20261112.md \
            docs/recovery/op01-op31-browser-agent-controller-combined-qualification-20261112.md
          if git diff --cached --quiet; then
            echo "Browser FieldStock documentation already consolidated."
          else
            git commit -m "Consolidate browser FieldStock recovery status"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
