name: Lot 9C3 STCK joint boundary

on:
  push:
    branches:
      - recovery/lot9c3-stck-joint-boundary-20261113
  pull_request:
    branches:
      - recovery/site109-reconstruction-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Verify STCK two-producer causality
        run: node --experimental-transform-types --test tests/v6-public-stck-joint-channels.test.ts
      - name: Qualify on real public STCK archive corpus
        env:
          LOT9C3_REPORT: lot9c3-public-stck-joint-report.json
        run: node --experimental-transform-types scripts/qualify-lot9c3-public-stck-joint.mjs
      - name: Run complete TypeScript regression suite
        run: node --experimental-transform-types --test tests/*.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot9c3-public-stck-joint-report
          path: lot9c3-public-stck-joint-report.json
          if-no-files-found: warn
