name: Lot 9B source refs

on:
  push:
    branches:
      - recovery/lot9b-source-refs-manifest-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Test source ref contract
        run: node --test tests/native-loop-region-source-refs.test.mjs
      - name: Compute source refs
        run: |
          node scripts/native-loop-region-source-refs.mjs \
            --output lot9b-native-region-source-refs.json
      - uses: actions/upload-artifact@v4
        with:
          name: lot9b-native-region-source-refs
          path: lot9b-native-region-source-refs.json
          if-no-files-found: error
