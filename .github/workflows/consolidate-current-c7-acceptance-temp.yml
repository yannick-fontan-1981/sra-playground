name: Consolidate current C7 acceptance

on:
  push:
    branches:
      - recovery/op01-op31-browser-field-stock-context-20261112

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Persist current accepted identity
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const headSha = '5669bb2edf38b1fa431050a2ca996833aad86876';
          const strict = {
            runId: 43361492824,
            jobId: 131675839595,
            artifactId: 14008357592,
            STCK: { referenceMedianMs: 41.35, candidateMedianMs: 41.70, relativeIncreasePercent: 0.8464328899690399 },
            SMLP: { referenceMedianMs: 87.05, candidateMedianMs: 82.65, relativeIncreasePercent: -5.054566341184941 },
          };
          const repeat = {
            runId: 43361492842,
            jobId: 131675894613,
            STCK: { referenceMedianMs: 53.85, candidateMedianMs: 54.10, relativeIncreasePercent: 0.46425255338227167 },
            SMLP: { referenceMedianMs: 108.75, candidateMedianMs: 108.90, relativeIncreasePercent: 0.13793103448074273 },
          };

          const manifestPath = 'docs/recovery/native-loop-runner-manifest.json';
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          manifest.status = 'official-abba-measurement-accepted';
          manifest.qualification.runnerContractTests = 24;
          manifest.qualification.finalQualificationRun = {
            runId: repeat.runId,
            jobId: repeat.jobId,
            headSha,
            node: '22.18.0',
            typecheck: 'passed',
            regression: { passed: 339, failed: 0, skipped: 0, cancelled: 0 },
            build: 'passed',
            workerPyodideParity: { status: 'passed', samplesCompared: 4, stepsCompared: 31 },
            nativeContracts: { passed: 24, failed: 0 },
          };
          manifest.officialMeasurement = {
            executed: true,
            status: 'accepted',
            accepted: true,
            protocol: 'A1/B1/B2/A2',
            isolation: 'non-isolated-shared-github-actions-runner-no-repository-concurrency',
            thresholdPercent: 10,
            strictlyLessThan: true,
            gamesEvaluatedSeparately: true,
            crossGameCompensationAllowed: false,
            runId: strict.runId,
            jobId: strict.jobId,
            headSha,
            artifactId: strict.artifactId,
            artifactName: 'op01-op31-strict-native-cost-report',
            totals: {
              invocations: 40,
              warmupSessions: 8,
              warmupActions: 24,
              measuredSessions: 32,
              measuredActions: 400,
            },
            games: {
              STCK: { ...strict.STCK, accepted: true },
              SMLP: { ...strict.SMLP, accepted: true },
            },
            repeatQualification: {
              runId: repeat.runId,
              jobId: repeat.jobId,
              headSha,
              accepted: true,
              games: {
                STCK: { ...repeat.STCK, accepted: true },
                SMLP: { ...repeat.SMLP, accepted: true },
              },
            },
          };
          await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const reportPath = 'docs/recovery/op01-op31-c7-official-acceptance-20261113.md';
          const report = `# OP01–OP31 — acceptation officielle C7

Date : 13 novembre 2026

## Identité courante qualifiée

- branche : \`recovery/op01-op31-browser-field-stock-context-20261112\` ;
- commit mesuré : \`${headSha}\` ;
- source A : \`${manifest.sourceRefs.reference}\` ;
- source B : \`${manifest.sourceRefs.candidate}\` ;
- protocole : A1/B1/B2/A2 ;
- environnement déclaré : \`non-isolated-shared-github-actions-runner-no-repository-concurrency\`.

Cette qualification ferme le critère de coût pour cette identité exacte. Elle ne prétend ni reproduire le matériel historique du Site 109, ni établir une identité binaire avec le runtime 0.68.

## Critère

- médiane globale de chaque jeu strictement inférieure à +10 % ;
- STCK et SMLP évalués séparément ;
- aucune compensation entre jeux ;
- aucune suppression ou substitution d’échantillon mesuré ;
- une phase interne peut dépasser +10 % si le global du jeu reste sous le seuil.

## Exécution stricte principale

- run : \`${strict.runId}\` ;
- job : \`${strict.jobId}\` ;
- SHA : \`${headSha}\` ;
- artifact : \`${strict.artifactId}\`, \`op01-op31-strict-native-cost-report\` ;
- 40 invocations ;
- 8 sessions de warmup et 24 actions de warmup ;
- 32 sessions mesurées et 400 actions mesurées.

| Jeu | Médiane A | Médiane B | Delta global | Verdict |
| --- | ---: | ---: | ---: | --- |
| STCK | 41,35 ms | 41,70 ms | +0,8464 % | accepté |
| SMLP | 87,05 ms | 82,65 ms | −5,0546 % | accepté |

Les deux jeux satisfont indépendamment le seuil strict inférieur à +10 %.

## Répétition dans la qualification complète

- run : \`${repeat.runId}\` ;
- job : \`${repeat.jobId}\` ;
- SHA : \`${headSha}\` ;
- STCK : 53,85 ms en A, 54,10 ms en B, +0,4643 %, accepté ;
- SMLP : 108,75 ms en A, 108,90 ms en B, +0,1379 %, accepté.

Cette seconde exécution confirme l’acceptation sans compenser ni remplacer le résultat principal.

## Qualification fonctionnelle du même SHA

- Node 22.18.0 ;
- \`npm ci\` réussi ;
- \`tsc --noEmit\` réussi ;
- **339/339 tests TypeScript réussis** ;
- build Vite réussi ;
- 100 jeux, 636 prévisualisations et 4 atlas natifs générés ;
- parité Worker/Pyodide qualifiée sur 4 échantillons et 31 étapes ;
- 24/24 contrats benchmark/sourceRef réussis.

Deux vulnérabilités de dépendances de sévérité haute, déjà présentes, restent signalées par \`npm ci\`. Elles ne sont pas introduites par cette tranche.

## Correctif de requalification

Le benchmark accepte maintenant exactement deux états valides du manifeste :

- \`ready-for-official-abba-measurement\` pour une première mesure ;
- \`official-abba-measurement-accepted\` pour une requalification du même chemin.

Le chargement de configuration est inclus dans le mécanisme de rapport d’erreur. Une erreur de configuration échoue donc rapidement au lieu de laisser l’orchestrateur attendre son délai maximal.

## Optimisations admises

- calcul du delta public 64×64 avec buffers typés bornés, à sortie équivalente ;
- identité \`methodRef\` minimale sans copie des frames lorsqu’elle ne dépend que de l’identité de l’action/session ;
- contrat explicite \`borrowed-readonly\` pour le hook Region officiel ;
- comportement \`cloned\` conservé par défaut pour les autres hooks.

Aucune optimisation ne modifie la décision Region, le corpus, le transport, les actions ou le protocole d’acceptation.

## Historique

L’exécution antérieure du SHA \`d45f2ce6566d052bbd3477c5653e99ae24381a0a\` reste conservée dans \`officialMeasurementHistory\`. Elle n’est pas attribuée à la nouvelle identité source.

## Verdict

**C7 est accepté pour l’identité courante sur STCK et SMLP.**

Les dettes restantes concernent le candidat produit Region complet, les acquisitions passives multi-propriétaires, la sauvegarde/restauration et OP31. Elles ne rouvrent pas automatiquement ce résultat tant que l’identité mesurée ne change pas.
`;
          await writeFile(reportPath, report);

          function replaceSection(text, start, end, replacement) {
            const startIndex = text.indexOf(start);
            const endIndex = text.indexOf(end, startIndex + start.length);
            if (startIndex < 0 || endIndex < 0) throw new Error(`cannot replace section ${start}`);
            return text.slice(0, startIndex) + replacement + '\n\n' + text.slice(endIndex);
          }

          const browserPath = 'docs/recovery/op01-op31-browser-field-stock-context-20261112.md';
          let browser = await readFile(browserPath, 'utf8');
          const browserC7 = `## Qualification C7 officielle

Le SHA \`${headSha}\` a passé le protocole strict A1/B1/B2/A2 :

- STCK : 41,35 ms en A, 41,70 ms en B, soit +0,8464 % ;
- SMLP : 87,05 ms en A, 82,65 ms en B, soit −5,0546 % ;
- seuil : strictement inférieur à +10 % par jeu ;
- compensation entre jeux : interdite ;
- verdict : accepté pour les deux jeux.

Le run principal est \`${strict.runId}\`, job \`${strict.jobId}\`. La qualification complète du run \`${repeat.runId}\`, job \`${repeat.jobId}\`, répète une mesure acceptée : +0,4643 % sur STCK et +0,1379 % sur SMLP.

Le même SHA passe 339/339 tests, le typecheck, le build, la parité Worker/Pyodide et 24/24 contrats benchmark/sourceRef.

Le correctif de configuration permet la requalification d’un manifeste déjà accepté et transforme toute erreur de chargement en rapport explicite, sans attente de timeout.

Preuve durable : \`docs/recovery/op01-op31-c7-official-acceptance-20261113.md\`.`;
          browser = replaceSection(browser, '## Qualification C7 officielle', '## Statut', browserC7);
          await writeFile(browserPath, browser);

          const marker = '## Requalification C7 de l’identité 5669bb2e';
          const update = `${marker}

Le commit \`${headSha}\` remplace l’identité courante de mesure après ajout du contrat de configuration et du rapport fail-fast du benchmark.

- garde strict : run \`${strict.runId}\`, job \`${strict.jobId}\` ;
- STCK : +0,8464 %, accepté ;
- SMLP : −5,0546 %, accepté ;
- qualification complète : run \`${repeat.runId}\`, job \`${repeat.jobId}\` ;
- 339/339 tests, build, parité Worker/Pyodide et 24/24 contrats réussis ;
- répétition : STCK +0,4643 %, SMLP +0,1379 %, acceptés.

L’ancienne mesure reste historique et n’est pas transférée à cette identité.
`;
          for (const path of [
            'docs/recovery/op01-op31-c7-diagnostic-status.md',
            'docs/migration/op01-op31-progress.md',
            'docs/recovery/site109-reconstruction-status.md',
          ]) {
            let text = await readFile(path, 'utf8');
            if (!text.includes(marker)) text += `\n${update}`;
            await writeFile(path, text);
          }
          NODE
      - name: Verify accepted manifest
        run: node scripts/verify-native-loop-runner-manifest.mjs
      - name: Typecheck and test current benchmark contracts
        run: |
          npm run typecheck
          node --experimental-strip-types --test tests/native-region-official-config.test.ts
          node --test \
            tests/native-loop-cost-harness.test.mjs \
            tests/native-loop-region-source-refs.test.mjs \
            tests/native-loop-runner-manifest.test.mjs \
            tests/native-loop-borrowed-hook-inputs.test.mjs
      - name: Commit current C7 acceptance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/recovery/native-loop-runner-manifest.json \
            docs/recovery/op01-op31-c7-official-acceptance-20261113.md \
            docs/recovery/op01-op31-browser-field-stock-context-20261112.md \
            docs/recovery/op01-op31-c7-diagnostic-status.md \
            docs/migration/op01-op31-progress.md \
            docs/recovery/site109-reconstruction-status.md
          git commit -m "Record current official C7 acceptance"
          git push origin HEAD:${GITHUB_REF_NAME}
