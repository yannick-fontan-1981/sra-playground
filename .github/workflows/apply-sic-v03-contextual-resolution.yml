          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'forbidden obsolete marker remains: {marker}')

          if text.count('```') % 2:
              raise SystemExit('unbalanced Markdown code fences')

          headings = re.findall(r'^## (\d+)\.', text, flags=re.MULTILINE)
          expected_headings = [str(number) for number in range(1, 35)]
          if headings != expected_headings:
              raise SystemExit(f'unexpected major heading sequence: {headings}')

          path.write_text(text, encoding='utf-8')
          print(f'updated {path}: {len(text.splitlines())} lines')
          PY

      - name: Commit updated SIC specification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/v8-human-configurable-intelligence.md
          git diff --cached --stat
          git commit -m "Add contextual need resolution to SIC architecture"
          git push origin HEAD:${{ github.ref_name }}
