name: OP01-OP31 session continuity finalize

on:
  push:
    branches:
      - op01-op31-session-continuity-20261113
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-and-finalize:
    if: ${{ !contains(github.event.head_commit.message, '[session-continuity-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply progress consolidation
        run: node scripts/apply-op01-op31-session-continuity-progress.mjs
      - name: Targeted session continuity tests
        run: node --experimental-transform-types --test tests/v6-common-campaign-session-continuity.test.ts tests/v6-common-campaign-owner.test.ts tests/v6-neutral-common-caller.test.ts
      - name: Full TypeScript regression
        run: node --experimental-transform-types --test tests/*.test.ts
      - name: Production build
        run: npm run build
      - name: Remove temporary finalization machinery
        run: |
          rm scripts/apply-op01-op31-session-continuity-progress.mjs
          rm .github/workflows/op01-op31-session-continuity-finalize.yml
      - name: Commit finalized evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'docs(op01-op31): finalize session continuity evidence [session-continuity-finalized]'
          git push origin HEAD:${GITHUB_REF_NAME}
