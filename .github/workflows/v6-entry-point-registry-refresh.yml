name: Refresh V6 entry-point registry after canonical advance

on:
  push:
    branches:
      - recovery/v6-entry-point-registry-20261113
    paths:
      - scripts/patch-v6-entry-point-registry-session-continuity.mjs
      - .github/workflows/v6-entry-point-registry-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Patch registry for qualified session continuity core
        run: node scripts/patch-v6-entry-point-registry-session-continuity.mjs
      - name: Commit refreshed registry
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/v6-entry-point-progress.json \
                  scripts/check-v6-entry-point-progress.mjs \
                  tests/v6-entry-point-progress.test.ts \
                  docs/recovery/v6-entry-point-registry-reconstruction-20261113.md
          if git diff --cached --quiet; then
            echo "No refresh changes"
          else
            git commit -m "Refresh V6 registry for session continuity core"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
