name: SIC SS08 to SS25 at a matched 160-command cap

on:
  push:
    branches: [audit/sic-sealed-cohort-matched-160]
    paths: [.github/workflows/sic-sealed-cohort.yml]

permissions:
  contents: read
  actions: read

env:
  VERIFIED_SOURCE: 1a3b4caa45c77065dd489de3a8e41c4cdf662b79
  VERIFIED_ENGINE: f31747a4aabd9372f24ed4e73a9cdf1891890c31
  NATIVE_SOURCE: 8025e9cb02a1ba446bc5d3f02cdd0dd56df20f46
  NATIVE_ENGINE: b7c31326212b478a939cb53ef56d6e8b65e510f6
  SOURCE_RUN: '46140352121'
  COVERAGE_SOURCE: af0fdaf8ea4e7624333889098d7f9b8edcd99813
  COVERAGE_RUN: '46140846955'
  SIC_COMPARISON_ACTION_CAP: '160'
  SIC_COMPARISON_TIME_CAP_MS: '180000'
  SIC_SOURCE_COMPOSER_EVIDENCE: '1'

jobs:
  qualification:
    name: Verify the source qualification before opening the sealed cohort
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check native source returns and the command-cost source receipts
        shell: bash
        run: |
          test "$(gh run view "$SOURCE_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$NATIVE_SOURCE success"
          test "$(gh run view "$COVERAGE_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$COVERAGE_SOURCE success"
          gh run download "$SOURCE_RUN" --dir source-receipts --pattern 'sic-witnessed-recovery-*'
          VERIFIED_SOURCE="$NATIVE_SOURCE" VERIFIED_ENGINE="$NATIVE_ENGINE" python3 scripts/verify-sic-sealed-source-gate.py source-receipts | tee -a "$GITHUB_STEP_SUMMARY"
          gh run download "$COVERAGE_RUN" --dir coverage-receipts --pattern 'sic-coverage-cost-*'
          python3 scripts/verify-sic-sealed-coverage-source-gate.py coverage-receipts | tee -a "$GITHUB_STEP_SUMMARY"
  replay:
    name: Sealed A/B ${{ matrix.game }}
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        game: [SS08, SS09, SS10, SS11, SS12, SS13, SS14, SS15, SS16, SS17, SS18, SS19, SS20, SS21, SS22, SS23, SS24, SS25]
    env:
      GAME: ${{ matrix.game }}
      SIC_SOURCE_COMPOSER_STRATEGY: motion_contrast
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify the qualified candidate and prepare
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SOURCE"
          test "$(git rev-parse HEAD:src)" = "$VERIFIED_ENGINE"
          npm ci
          node scripts/prepare-python.mjs
      - name: Replay both arms from level 1 under the matched extended caps
        run: |
          mkdir replay
          git rev-parse HEAD HEAD:src > replay/identity
          printf '%s\n' "$GAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> replay/identity
          date -u +%s%3N > replay/start-ms
          SIC_SOURCE_COMPOSER_ARM=fixed node scripts/check-sic-chronological.mjs "$GAME" auto replay/fixed.jsonl 1 sic > replay/fixed.log 2>&1
          SIC_SOURCE_COMPOSER_ARM=active SIC_SOURCE_TRANSPORT_UNDO=1 SIC_SOURCE_SHORTEST_COVERAGE=1 SIC_SEALED_COVERAGE_QUALIFIED=1 node scripts/check-sic-chronological.mjs "$GAME" auto replay/active.jsonl 1 sic > replay/active.log 2>&1
          date -u +%s%3N > replay/end-ms
          git diff --exit-code
          cd replay
          sha256sum fixed.jsonl active.jsonl *.levels identity start-ms end-ms > sha256sums
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sic-sealed-cohort-${{ matrix.game }}
          path: replay/
          retention-days: 14

  aggregate:
    name: Verify all 18 pairs and count official level wins
    needs: replay
    if: always() && needs.replay.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sic-sealed-cohort-SS*
          path: downloads
      - run: python3 scripts/summarize-sic-sealed-cohort.py downloads summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: sic-sealed-cohort-summary
          path: summary.json
