name: SIC frozen source candidate on SS08 to SS25

on:
  push:
    branches: [audit/sic-sealed-cohort-42f0bf15]
    paths: [.github/workflows/sic-sealed-cohort.yml]

permissions:
  contents: read

env:
  VERIFIED_SOURCE: 42f0bf1512730db1cdd843714e60bc2a0df09c60
  VERIFIED_ENGINE: bbf754a3df5c720680e9c7186d16895980668cb3

jobs:
  replay:
    name: Sealed A/B ${{ matrix.game }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        game: [SS08, SS09, SS10, SS11, SS12, SS13, SS14, SS15, SS16, SS17, SS18, SS19, SS20, SS21, SS22, SS23, SS24, SS25]
    env:
      GAME: ${{ matrix.game }}
      SIC_SOURCE_COMPOSER_STRATEGY: motion_contrast
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify the qualified candidate and prepare
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SOURCE"
          test "$(git rev-parse HEAD:src)" = "$VERIFIED_ENGINE"
          npm ci
          node scripts/prepare-python.mjs
      - name: Replay from level 1 under the original two bounds
        run: |
          mkdir replay
          git rev-parse HEAD HEAD:src > replay/identity
          printf '%s\n' "$GAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> replay/identity
          date -u +%s%3N > replay/start-ms
          SIC_SOURCE_COMPOSER_ARM=fixed node scripts/check-sic-chronological.mjs "$GAME" auto replay/fixed.jsonl 1 sic > replay/fixed.log 2>&1
          SIC_SOURCE_COMPOSER_ARM=active SIC_SOURCE_TRANSPORT_UNDO=1 node scripts/check-sic-chronological.mjs "$GAME" auto replay/active.jsonl 1 sic > replay/active.log 2>&1
          date -u +%s%3N > replay/end-ms
          git diff --exit-code
          cd replay
          sha256sum fixed.jsonl active.jsonl *.levels identity start-ms end-ms > sha256sums
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sic-sealed-cohort-${{ matrix.game }}
          path: replay/
          retention-days: 14

  aggregate:
    name: Verify all 18 pairs and count official level wins
    needs: replay
    if: always() && needs.replay.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sic-sealed-cohort-SS*
          path: downloads
      - run: python3 scripts/summarize-sic-sealed-cohort.py downloads summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: sic-sealed-cohort-summary
          path: summary.json
