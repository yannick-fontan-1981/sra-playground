name: SIC qualified LS19 course
on:
  push:
    branches: [audit/sic-ls19-975d9d80, audit/sic-ls19-14db9cd8]
permissions:
  contents: read
jobs:
  ls19:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHILD: ${{ github.ref_name == 'audit/sic-ls19-14db9cd8' && '14db9cd82a345752030531e9db37fb7c0ea6df45' || '975d9d809ba1cb41dd8c63414586cb95498018b1' }}
      PARENT: ${{ github.ref_name == 'audit/sic-ls19-14db9cd8' && '68efddd2d009ace4f4b898cc82c4bb7941e815ae' || '13ebd79de759b1052e1b261d9c6c3f5b2205d7f9' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/architecture/sic-replay-reference-levels-20261126.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHILD }}
          path: engine
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Play the complete frozen course from level one on both engines
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          parent=$PARENT
          child=$CHILD
          test "$(git rev-parse "$child^")" = "$parent"
          mkdir "$GITHUB_WORKSPACE/results"
          export SIC_REPLAY_REFERENCES="$GITHUB_WORKSPACE/bench/docs/architecture/sic-replay-reference-levels-20261126.json"
          capture() {
            local revision=$1
            git checkout --detach "$revision"
            test "$(git rev-parse HEAD)" = "$revision"
            node scripts/prepare-python.mjs
            out="$GITHUB_WORKSPACE/results/$revision"
            export SIC_DECISION_TRACE="$out.jsonl"
            node "$GITHUB_WORKSPACE/bench/scripts/check-sic-chronological.mjs" LS19 auto "$out.receipt" 1 sic
            sha256sum "$out.jsonl" | cut -d' ' -f1 > "$out.trace.sha256"
          }
          if [[ "$GITHUB_REF_NAME" == audit/sic-ls19-14db9cd8 ]]; then
            previous=975d9d809ba1cb41dd8c63414586cb95498018b1
            test "$(git rev-parse "$parent^")" = "$previous"
            git diff --quiet "$previous" "$parent" -- src scripts public reference
            capture "$child"
            cd "$GITHUB_WORKSPACE/results"
            # The public receipt of run 46072741568 binds this whole ordered stream to line 90.
            if [[ $(cat "$child.trace.sha256") == 7ec30f06246a364b6eb92ff978837053652bbe95868478fcaebdacac0d8c3c48 ]]; then
              python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert (r["levels"],r["target"],r["actions"],r["authority"],r["reason"])==(8,8,332,332,"target_levels_completed"); print(json.dumps(dict(equal=True, game="LS19", events=2593, decisions=332, method="verified-parent-trace-sha256", parentRun="46072741568")))' "$child.receipt" > comparison.json
              exit
            fi
            cd "$GITHUB_WORKSPACE/engine"
            capture "$parent"
          else
            capture "$parent"
            capture "$child"
          fi
          cd "$GITHUB_WORKSPACE/results"
          node ../bench/scripts/compare-sic-decisions.mjs "$parent.jsonl" "$child.jsonl" > comparison.json
          python3 -c 'import glob,json; rows=[json.load(open(f)) for f in glob.glob("*.receipt")]; assert len(rows)==2 and all(r["reason"]=="target_levels_completed" and r["levels"]==8 and r["authority"]==r["actions"] for r in rows)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls19-course
          path: |
            results/*.receipt
            results/*.trace.sha256
            results/comparison.json
          retention-days: 14
