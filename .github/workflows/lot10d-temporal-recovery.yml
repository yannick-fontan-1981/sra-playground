name: Lot10D Temporal recovery contracts

on:
  push:
    branches:
      - recovery/lot10d-temporal-selection-rebased-20261112
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temporal-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize ActionBoundary temporal identity and uncertainty window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/v6-temporal-action-boundary.ts')
          source = path.read_text(encoding='utf-8')
          changed = False

          valid_revision = """function validRevision(value: number): boolean {
            return Number.isInteger(value) && value >= 0;
          }
          """
          valid_revision_and_epoch = """function validRevision(value: number): boolean {
            return Number.isInteger(value) && value >= 0;
          }

          function validLevelEpoch(value: string | number): boolean {
            return typeof value === 'string'
              ? validRef(value)
              : validRevision(value);
          }
          """
          if 'function validLevelEpoch(' not in source:
              if valid_revision not in source:
                  raise SystemExit('cannot locate validRevision helper')
              source = source.replace(
                  valid_revision,
                  valid_revision_and_epoch,
                  1,
              )
              changed = True

          old_epoch_checks = (
              '!validRevision(response.observationIdentity.levelEpoch)',
              '!validRevision(dispatch.observationIdentity.levelEpoch)',
          )
          new_epoch_checks = (
              '!validLevelEpoch(response.observationIdentity.levelEpoch)',
              '!validLevelEpoch(dispatch.observationIdentity.levelEpoch)',
          )
          for old, new in zip(old_epoch_checks, new_epoch_checks):
              if old in source:
                  source = source.replace(old, new, 1)
                  changed = True
              elif new not in source:
                  raise SystemExit(f'cannot locate temporal epoch check: {old}')

          lines = source.splitlines()
          hook_marker = 'await input.qualificationHooks?.afterAttemptPersistedBeforeTransport?.('
          hook_index = next(
              (index for index, line in enumerate(lines) if line.strip() == hook_marker),
              None,
          )
          if hook_index is not None:
              response_index = next(
                  index
                  for index in range(hook_index + 1, len(lines))
                  if lines[index].strip() == 'let response: TemporalEnvironmentActionResponse;'
              )
              hook_lines = lines[hook_index:response_index]
              while hook_lines and not hook_lines[-1].strip():
                  hook_lines.pop()
              del lines[hook_index:response_index]
              if lines[hook_index].strip() != 'let response: TemporalEnvironmentActionResponse;':
                  raise SystemExit('response declaration did not move into expected position')
              if lines[hook_index + 1].strip() != 'try {':
                  raise SystemExit('transport try block did not follow response declaration')
              indented_hook = [
                  f'  {line}' if line.strip() else line
                  for line in hook_lines
              ]
              lines[hook_index + 2:hook_index + 2] = indented_hook
              source = '\n'.join(lines) + '\n'
              changed = True

          if changed:
              path.write_text(source, encoding='utf-8')
          PY
          if ! git diff --quiet -- src/runtime/v6-temporal-action-boundary.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/runtime/v6-temporal-action-boundary.ts
            git commit -m "fix(lot10d): align ActionBoundary temporal identity"
            git push origin HEAD:recovery/lot10d-temporal-selection-rebased-20261112
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run affected V6 runtime, Logos and TemporalSelection tests
        run: >-
          node --experimental-strip-types --test
          tests/v6-agent-worker-core.test.ts
          tests/v6-agent-worker.test.ts
          tests/v6-temporal-decision-port.test.ts
          tests/v6-temporal-act-release-audit.test.ts
          tests/v6-temporal-action-binding.test.ts
          tests/v6-temporal-action-release-permit.test.ts
          tests/v6-temporal-act-consumption.test.ts
          tests/v6-temporal-action-boundary.test.ts
          tests/v6-temporal-action-donor-audit.test.ts
          tests/v6-composition-engine.test.ts
          tests/v6-native-authority.test.ts
          tests/v6-operation-cache.test.ts
          tests/v6-operation-cycle.test.ts
          tests/v6-operation-trace.test.ts
          tests/v6-operations.test.ts
          tests/v6-target-binding.test.ts
          tests/v6-temporal-selection-contract.test.ts
          tests/v6-temporal-memory-contract.test.ts
          tests/v6-temporal-return-contract.test.ts
          tests/v6-temporal-observation-state.test.ts
          tests/v6-temporal-decision-receipt.test.ts
          tests/v6-temporal-selection-adapter.test.ts
          tests/v6-temporal-selection-bridge.test.ts
      - name: Typecheck reconstructed TemporalSelection, action binding, permit, ACT consumption, ActionBoundary, audit, passive port and shared trace sources
        run: >-
          npx tsc --noEmit
          --target ES2022
          --module ESNext
          --moduleResolution Bundler
          --allowImportingTsExtensions
          --strict
          --skipLibCheck
          src/logos-engine/v6-operation-trace.ts
          src/logos-engine/v6-temporal-selection-contract.ts
          src/logos-engine/v6-temporal-memory-contract.ts
          src/logos-engine/v6-temporal-return-contract.ts
          src/logos-engine/v6-temporal-observation-state.ts
          src/logos-engine/v6-temporal-decision-receipt.ts
          src/logos-engine/v6-temporal-selection-adapter.ts
          src/logos-engine/v6-temporal-selection-bridge.ts
          src/runtime/contracts.ts
          src/runtime/v6-agent-worker-core.ts
          src/runtime/v6-agent-worker.ts
          src/runtime/v6-temporal-decision-port.ts
          src/runtime/v6-temporal-act-release-audit.ts
          src/runtime/v6-temporal-action-binding.ts
          src/runtime/v6-temporal-action-release-permit.ts
          src/runtime/v6-temporal-act-consumption.ts
          src/runtime/v6-temporal-action-boundary.ts

# qualification-head: temporal-action-boundary-dispatch
