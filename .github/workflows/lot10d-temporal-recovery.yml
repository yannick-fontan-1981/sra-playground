name: Lot10D Temporal recovery contracts

on:
  push:
    branches:
      - recovery/lot10d-temporal-selection-rebased-20261112
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temporal-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize ActionBoundary source for Node strip-only mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/v6-temporal-action-boundary.ts')
          source = path.read_text(encoding='utf-8')

          old_refusal = """export class TemporalActionBoundaryDispatchRefusedError
            extends TemporalActionBoundaryError {
            readonly outcomeStatus = 'not_dispatched_release_refused' as const;
            readonly redeliveryPermitted = false as const;
            readonly reconciliationRequired = true as const;
            readonly transportAttempted = false as const;

            constructor(
              readonly reason: TemporalActionBoundaryDispatchRefusalReason,
            ) {
              super(`temporal ActionBoundary refused before transport: ${reason}`);
              this.name = 'TemporalActionBoundaryDispatchRefusedError';
            }
          }
          """
          new_refusal = """export class TemporalActionBoundaryDispatchRefusedError
            extends TemporalActionBoundaryError {
            readonly outcomeStatus = 'not_dispatched_release_refused' as const;
            readonly redeliveryPermitted = false as const;
            readonly reconciliationRequired = true as const;
            readonly transportAttempted = false as const;
            readonly reason: TemporalActionBoundaryDispatchRefusalReason;

            constructor(reason: TemporalActionBoundaryDispatchRefusalReason) {
              super(`temporal ActionBoundary refused before transport: ${reason}`);
              this.name = 'TemporalActionBoundaryDispatchRefusedError';
              this.reason = reason;
            }
          }
          """

          old_uncertain = """export class TemporalActionBoundaryUncertainError
            extends TemporalActionBoundaryError {
            readonly outcomeStatus = 'unknown' as const;
            readonly redeliveryPermitted = false as const;
            readonly reconciliationRequired = true as const;

            constructor(
              readonly dispatchRef: string,
              readonly requestDigest: string,
              readonly journal: TemporalActionBoundaryJournal,
              cause?: unknown,
            ) {
              super(
                `dispatch outcome is unknown for ${dispatchRef}; redelivery is forbidden until external reconciliation`,
              );
              this.name = 'TemporalActionBoundaryUncertainError';
              if (cause !== undefined) {
                (this as Error & { cause?: unknown }).cause = cause;
              }
            }
          }
          """
          new_uncertain = """export class TemporalActionBoundaryUncertainError
            extends TemporalActionBoundaryError {
            readonly outcomeStatus = 'unknown' as const;
            readonly redeliveryPermitted = false as const;
            readonly reconciliationRequired = true as const;
            readonly dispatchRef: string;
            readonly requestDigest: string;
            readonly journal: TemporalActionBoundaryJournal;

            constructor(
              dispatchRef: string,
              requestDigest: string,
              journal: TemporalActionBoundaryJournal,
              cause?: unknown,
            ) {
              super(
                `dispatch outcome is unknown for ${dispatchRef}; redelivery is forbidden until external reconciliation`,
              );
              this.name = 'TemporalActionBoundaryUncertainError';
              this.dispatchRef = dispatchRef;
              this.requestDigest = requestDigest;
              this.journal = structuredClone(journal);
              if (cause !== undefined) {
                (this as Error & { cause?: unknown }).cause = cause;
              }
            }
          }
          """

          old_hook = """  await input.qualificationHooks?.afterAttemptPersistedBeforeTransport?.(
            structuredClone(request),
            structuredClone(persistedAttemptJournal),
          );

          let response: TemporalEnvironmentActionResponse;
          try {
            response = await input.transport.execute(structuredClone(request));
          """
          new_hook = """  let response: TemporalEnvironmentActionResponse;
          try {
            await input.qualificationHooks?.afterAttemptPersistedBeforeTransport?.(
              structuredClone(request),
              structuredClone(persistedAttemptJournal),
            );
            response = await input.transport.execute(structuredClone(request));
          """

          replacements = (
              (old_refusal, new_refusal, 'dispatch-refused constructor'),
              (old_uncertain, new_uncertain, 'uncertain constructor'),
              (old_hook, new_hook, 'post-attempt uncertainty window'),
          )
          changed = False
          for old, new, label in replacements:
              if old in source:
                  source = source.replace(old, new, 1)
                  changed = True
              elif new not in source:
                  raise SystemExit(f'cannot locate expected {label} source')

          if changed:
              path.write_text(source, encoding='utf-8')
          PY
          if ! git diff --quiet -- src/runtime/v6-temporal-action-boundary.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/runtime/v6-temporal-action-boundary.ts
            git commit -m "fix(lot10d): support Node strip-only ActionBoundary"
            git push origin HEAD:recovery/lot10d-temporal-selection-rebased-20261112
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run affected V6 runtime, Logos and TemporalSelection tests
        run: >-
          node --experimental-strip-types --test
          tests/v6-agent-worker-core.test.ts
          tests/v6-agent-worker.test.ts
          tests/v6-temporal-decision-port.test.ts
          tests/v6-temporal-act-release-audit.test.ts
          tests/v6-temporal-action-binding.test.ts
          tests/v6-temporal-action-release-permit.test.ts
          tests/v6-temporal-act-consumption.test.ts
          tests/v6-temporal-action-boundary.test.ts
          tests/v6-temporal-action-donor-audit.test.ts
          tests/v6-composition-engine.test.ts
          tests/v6-native-authority.test.ts
          tests/v6-operation-cache.test.ts
          tests/v6-operation-cycle.test.ts
          tests/v6-operation-trace.test.ts
          tests/v6-operations.test.ts
          tests/v6-target-binding.test.ts
          tests/v6-temporal-selection-contract.test.ts
          tests/v6-temporal-memory-contract.test.ts
          tests/v6-temporal-return-contract.test.ts
          tests/v6-temporal-observation-state.test.ts
          tests/v6-temporal-decision-receipt.test.ts
          tests/v6-temporal-selection-adapter.test.ts
          tests/v6-temporal-selection-bridge.test.ts
      - name: Typecheck reconstructed TemporalSelection, action binding, permit, ACT consumption, ActionBoundary, audit, passive port and shared trace sources
        run: >-
          npx tsc --noEmit
          --target ES2022
          --module ESNext
          --moduleResolution Bundler
          --allowImportingTsExtensions
          --strict
          --skipLibCheck
          src/logos-engine/v6-operation-trace.ts
          src/logos-engine/v6-temporal-selection-contract.ts
          src/logos-engine/v6-temporal-memory-contract.ts
          src/logos-engine/v6-temporal-return-contract.ts
          src/logos-engine/v6-temporal-observation-state.ts
          src/logos-engine/v6-temporal-decision-receipt.ts
          src/logos-engine/v6-temporal-selection-adapter.ts
          src/logos-engine/v6-temporal-selection-bridge.ts
          src/runtime/contracts.ts
          src/runtime/v6-agent-worker-core.ts
          src/runtime/v6-agent-worker.ts
          src/runtime/v6-temporal-decision-port.ts
          src/runtime/v6-temporal-act-release-audit.ts
          src/runtime/v6-temporal-action-binding.ts
          src/runtime/v6-temporal-action-release-permit.ts
          src/runtime/v6-temporal-act-consumption.ts
          src/runtime/v6-temporal-action-boundary.ts

# qualification-head: temporal-action-boundary-dispatch
