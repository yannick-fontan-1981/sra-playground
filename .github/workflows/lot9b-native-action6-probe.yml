name: Lot 9B native ACTION6 probe

on:
  push:
    branches:
      - recovery/lot9b-native-probe-ci-20261112
      - recovery/lot9b-stck-public-stack-probe-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Targeted Lot 9B tests
        run: |
          node --test \
            tests/native-loop-region-public-action6-probe.test.mjs \
            tests/native-loop-region-candidate-hook.test.mjs \
            tests/native-loop-public-corpus-runner.test.mjs \
            tests/native-loop-explicit-runners.test.mjs
      - name: Execute real archive probe
        env:
          LOT9B_NATIVE_PROBE_REPORT: lot9b-native-probe-report.json
        run: node scripts/qualify-native-action6-probe.mjs
      - name: Diagnose STCK ACTION6 reachability
        run: node scripts/diagnose-stck-action6-reachability.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot9b-native-action6-probe
          path: lot9b-native-probe-report.json
          if-no-files-found: warn
