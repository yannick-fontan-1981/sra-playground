name: SIC witnessed temporal suffix on authorized sources

on:
  push:
    branches: [experiment/sic-pilot-witnessed-cycles]
    paths: [.github/workflows/sic-source-witnessed-cycles.yml]

permissions:
  contents: read

jobs:
  replay:
    name: Source temporal A/B ${{ matrix.game }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        game: [EVAS, SMLP, ONDE, PORT, DC22]
    env:
      GAME: ${{ matrix.game }}
      SIC_SOURCE_COMPOSER_ARM: active
      SIC_SOURCE_COMPOSER_STRATEGY: motion_contrast
      SIC_SOURCE_TRANSPORT_UNDO: '1'
      SIC_SOURCE_COMPOSER_EVIDENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-python.mjs
      - name: Compare witnessed transient inference under the same bounds
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir replay
          git rev-parse HEAD HEAD:src > replay/identity
          date -u +%s%3N > replay/start-ms
          node scripts/check-sic-chronological.mjs "$GAME" 3 replay/base.jsonl 1 sic
          SIC_SOURCE_WITNESSED_TRANSIENT=1 node scripts/check-sic-chronological.mjs "$GAME" 3 replay/active.jsonl 1 sic
          date -u +%s%3N > replay/end-ms
          git diff --exit-code
          cd replay
          sha256sum base.jsonl active.jsonl *.levels identity start-ms end-ms > sha256sums
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sic-witnessed-cycles-${{ matrix.game }}
          path: replay/
          retention-days: 14
