name: OP01-OP31 browser session resume finalize

on:
  push:
    branches:
      - op01-op31-browser-session-resume-20261113
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  qualify-and-finalize:
    name: qualify-and-finalize
    if: ${{ !contains(github.event.head_commit.message, '[browser-session-resume-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Targeted browser continuity tests
        run: |
          set -o pipefail
          node --experimental-transform-types --test \
            tests/v6-browser-session-resume.test.ts \
            tests/v6-common-campaign-session-continuity.test.ts \
            tests/v6-browser-common-campaign-host.test.ts \
            tests/v6-browser-agent-controller.test.ts \
            tests/v6-browser-product-campaign-host.test.ts \
            | tee /tmp/browser-resume-targeted.tap
      - name: Full TypeScript regression
        run: |
          set -o pipefail
          node --experimental-transform-types --test tests/*.test.ts \
            | tee /tmp/browser-resume-full.tap
      - name: Verify current V6 entry registry
        run: node scripts/check-v6-entry-point-progress.mjs
      - name: Production build
        run: |
          set -o pipefail
          npm run build | tee /tmp/browser-resume-build.log
      - name: Generate durable qualification evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/finalize-op01-op31-browser-session-resume.mjs
      - name: Remove temporary finalization machinery
        run: |
          rm scripts/finalize-op01-op31-browser-session-resume.mjs
          rm .github/workflows/op01-op31-browser-session-resume-finalize.yml
      - name: Commit finalized evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'docs(op01-op31): finalize browser session resume evidence [browser-session-resume-finalized]'
          git push origin HEAD:${GITHUB_REF_NAME}
