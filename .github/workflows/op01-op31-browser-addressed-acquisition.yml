name: OP01-OP31 browser addressed acquisition

on:
  push:
    branches:
      - op01-op31-browser-addressed-acquisition-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Full TypeScript regression
        run: node --experimental-transform-types --test tests/*.test.ts
      - name: Production build
        run: npm run build
      - name: Product wiring report
        run: node scripts/check-op01-op31-product-wiring.mjs
