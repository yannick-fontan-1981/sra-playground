name: Apply V8 SIC document v0.2

on:
  push:
    branches:
      - architecture/v8-human-configurable-intelligence-20261112
    paths:
      - .github/workflows/apply-v8-v02.yml

permissions:
  contents: write

jobs:
  apply-document:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and verify Markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          root = Path('docs/architecture')
          chunks = sorted(root.glob('.v8-v02-chunk-*'))
          if len(chunks) != 6:
              raise SystemExit(f'expected 6 chunks, found {len(chunks)}')
          encoded = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          data = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(data).hexdigest()
          expected = '98ad314c5861db72b503045a46762a7ae72ad47656e9a6827502fd1d68d24e3e'
          if digest != expected:
              raise SystemExit(f'unexpected document digest: {digest}')
          text = data.decode('utf-8')
          required = [
              '# Symbolic Intelligence Configuration',
              'Assimilation',
              'Exploration',
              'Solving',
              'exactement un token de concentration',
              'Niveaux de vérification',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker: {marker}')
          forbidden = [
              'non Turing-complète par défaut',
              'Logos Cognitive Contracts',
              'Extension future : plusieurs tokens',
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'forbidden marker remains: {marker}')
          if text.count('```') % 2:
              raise SystemExit('unbalanced Markdown code fences')
          target = root / 'v8-human-configurable-intelligence.md'
          target.write_bytes(data)
          print(f'wrote {target} ({len(data)} bytes, sha256={digest})')
          PY

      - name: Commit updated specification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/v8-human-configurable-intelligence.md
          git commit -m "Revise V8 architecture decisions and SIC terminology"
          git push origin HEAD:${{ github.ref_name }}
