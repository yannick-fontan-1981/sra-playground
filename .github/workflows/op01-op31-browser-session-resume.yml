name: OP01-OP31 browser session resume

on:
  push:
    branches:
      - op01-op31-browser-session-resume-20261113
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-qualify:
    if: ${{ !contains(github.event.head_commit.message, '[browser-session-resume-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair temporary generator quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-op01-op31-browser-session-resume.mjs')
          source = path.read_text()
          source = source.replace(
              "?? ((observation, ordinal) => `browser-agent:${observation.gameCode}:${ordinal}`);",
              "?? ((observation, ordinal) => ['browser-agent', observation.gameCode, ordinal].join(':'));",
          )
          source = source.replace(
              "return `fresh-session:${ordinal}`;",
              "return ['fresh-session', ordinal].join(':');",
          )
          path.write_text(source)
          PY
          node --check scripts/apply-op01-op31-browser-session-resume.mjs
      - name: Apply browser session resume patch
        run: node scripts/apply-op01-op31-browser-session-resume.mjs
      - name: Targeted browser continuity tests
        run: node --experimental-transform-types --test tests/v6-browser-session-resume.test.ts tests/v6-common-campaign-session-continuity.test.ts tests/v6-browser-common-campaign-host.test.ts tests/v6-browser-agent-controller.test.ts tests/v6-browser-product-campaign-host.test.ts
      - name: Full TypeScript regression
        run: node --experimental-transform-types --test tests/*.test.ts
      - name: Production build
        run: npm run build
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-op01-op31-browser-session-resume.mjs
          rm .github/workflows/op01-op31-browser-session-resume.yml
      - name: Commit qualified browser resume
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'feat(op01-op31): resume browser campaign checkpoints [browser-session-resume-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
