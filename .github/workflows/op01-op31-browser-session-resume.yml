name: OP01-OP31 browser session resume

on:
  push:
    branches:
      - op01-op31-browser-session-resume-20261113
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-qualify:
    if: ${{ !contains(github.event.head_commit.message, '[browser-session-resume-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restrict temporary patch driver to remaining host changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-op01-op31-browser-session-resume.mjs')
          source = path.read_text(encoding='utf-8')
          first_patch = "await patchFile('src/runtime/v6-browser-campaign-checkpoint.ts'"
          host_patch = "await patchFile('src/runtime/v6-browser-common-campaign-host.ts'"
          if first_patch not in source or host_patch not in source:
              raise SystemExit('temporary host patch boundary not found')
          source = source[:source.index(first_patch)] + source[source.index(host_patch):]
          source = source.replace(
              "    const current = checkpoint.current === null\\n      ? null\\n      : structuredClone(record(checkpoint.current, 'browser FieldStock checkpoint current'))\\n        as unknown as PublicCampaignObservation;\\n",
              "    const restoreCurrent = (candidate: unknown): PublicCampaignObservation => {\\n      const cloned = structuredClone(record(candidate, 'browser FieldStock checkpoint current'));\\n      return cloned as unknown as PublicCampaignObservation;\\n    };\\n    const current = checkpoint.current === null\\n      ? null\\n      : restoreCurrent(checkpoint.current);\\n",
          )
          marker = '\nconst controller = `'
          if marker not in source:
              raise SystemExit('temporary patch boundary not found')
          path.write_text(source.split(marker, 1)[0] + '\n', encoding='utf-8')
          PY
          node --check scripts/apply-op01-op31-browser-session-resume.mjs
      - name: Apply browser host session resume patch
        run: node scripts/apply-op01-op31-browser-session-resume.mjs
      - name: Targeted browser continuity tests
        run: node --experimental-transform-types --test tests/v6-browser-session-resume.test.ts tests/v6-common-campaign-session-continuity.test.ts tests/v6-browser-common-campaign-host.test.ts tests/v6-browser-agent-controller.test.ts tests/v6-browser-product-campaign-host.test.ts
      - name: Full TypeScript regression
        run: node --experimental-transform-types --test tests/*.test.ts
      - name: Production build
        run: npm run build
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-op01-op31-browser-session-resume.mjs
          rm .github/workflows/op01-op31-browser-session-resume.yml
      - name: Commit qualified browser resume
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'feat(op01-op31): resume browser campaign checkpoints [browser-session-resume-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
