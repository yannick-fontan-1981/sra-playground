name: OP01-OP31 Agent mode controller qualification

on:
  push:
    branches:
      - recovery/op01-op31-agent-mode-controller-20261112

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-transform-types --test tests/*.test.ts
