name: OP01-OP31 C1-C2 qualification

on:
  push:
    branches:
      - op01-op31-c1-c2-public-observation-op28-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Full TypeScript regression
        run: node --experimental-transform-types --test tests/*.test.ts
