name: Materialize V6 entry-point registry

on:
  push:
    branches:
      - recovery/v6-entry-point-registry-20261113
    paths:
      - scripts/materialize-v6-entry-point-registry-a.mjs
      - scripts/materialize-v6-entry-point-registry-b.mjs
      - .github/workflows/v6-entry-point-registry.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Materialize registry files
        run: |
          node scripts/materialize-v6-entry-point-registry-a.mjs
          node scripts/materialize-v6-entry-point-registry-b.mjs
      - name: Commit generated registry
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/v6-entry-point-progress.json \
                  scripts/check-v6-entry-point-progress.mjs \
                  tests/v6-entry-point-progress.test.ts \
                  docs/recovery/v6-entry-point-registry-reconstruction-20261113.md
          if git diff --cached --quiet; then
            echo "No materialization changes"
          else
            git commit -m "Reconstruct V6 entry-point evidence registry"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
